services:

  # ── MariaDB ──────────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # root con contraseña aleatoria: la app y los gestores de BD usan DB_USER/DB_PASS
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE:      ${DB_NAME:?DB_NAME es requerido en .env}
      MARIADB_USER:          ${DB_USER:?DB_USER es requerido en .env}
      MARIADB_PASSWORD:      ${DB_PASS:?DB_PASS es requerido en .env}
    # max_connections debe cubrir WORKERS × (DB_POOL_SIZE + DB_MAX_OVERFLOW) × réplicas + margen
    # wait_timeout debe ser mayor que DB_POOL_RECYCLE (180s)
    # collation del servidor = DB_COLLATION: la base creada y la sesión de la app coinciden
    command:
      - --max-connections=300
      - --wait-timeout=600
      - --character-set-server=utf8mb4
      - --collation-server=${DB_COLLATION:-utf8mb4_unicode_ci}
    volumes:
      # La base arranca vacía: el esquema (database/*.sql) se aplica con el gestor de BD
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      # Solo nginx puede fijar la IP del cliente vía X-Forwarded-For
      FORWARDED_ALLOW_IPS: "172.28.0.0/24"
      # Menor que stop_grace_period para que el lifespan alcance a cerrar el pool
      GRACEFUL_TIMEOUT: "20"
    stop_grace_period: 30s
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Nginx ─────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

volumes:
  mariadb_data:
  uploads_data:
  nginx_logs:
  certbot_www:
  certbot_certs:

networks:
  backend:   # API ↔ MariaDB (interna)
    driver: bridge
  frontend:  # Nginx ↔ API
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
